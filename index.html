    <!-- UTMify Pixel Script -->
    <script>
      (function() {
        try {
          // Silenciar erros de tracking não críticos
          const originalFetch = window.fetch;
          window.fetch = function(...args) {
            const url = args[0]?.toString() || '';
            // Ignorar requisições para localhost:3001/tracking
            if (url.includes('localhost:3001/tracking') || url.includes('api6.ipify.org')) {
              return Promise.reject(new Error('Tracking request blocked'));
            }
            return originalFetch.apply(this, args).catch(err => {
              if (url.includes('tracking') || url.includes('pixel')) {
                // Silenciar erros de tracking
                return Promise.reject(err);
              }
              throw err;
            });
          };

          window.pixelId = "6948fe018f96554d7af8e788";
          var a = document.createElement("script");
          a.setAttribute("async", "");
          a.setAttribute("defer", "");
          a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
          a.onerror = function() {
            console.warn('UTMify Pixel script failed to load');
          };
          document.head.appendChild(a);
        } catch (e) {
          console.warn('Error loading UTMify Pixel:', e);
        }
      })();
